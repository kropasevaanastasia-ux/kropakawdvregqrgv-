<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Семья Кропачевых</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Семья Кропачевых</h1>
    <p>Если че то не так-это артем</p>
    <div class="family-card">
        <h2>Ну ладно, не обижаем маленького</h2>

        <p>Вот наши мили фоточки</p>
        </div>
        <div class="family-main-photo">
        <img src="mmm.jpg" alt="Вся наша семья">
        </div>
    <div class="family-section">
        <h2> Вот смотрите это все мы</h2>

        <p>Помните?</p>
        <div class="family-members">


            <div class="member">
                <div class="member-photo">
                    <img src="img_123.jpg" alt="Мама">
            </div>
            
                <h3>Мама</h3>
                <p>Миленькая</p>
            </div>

            <div class="member">
                <div class="member-photo">
                    <img src="papi.jpg" alt="Папа">
                </div>
                 <h3>Папа</h3>
                 <p>Немного потрепанный</p>
            </div>
            <div class="member">
                 <div class="member-photo">
                    <img src="dochkaa.jpg" alt="Дочка">
                 </div>
                 <h3>Это яя</h3>
                 <p>Любимая доченька.</p>
             </div>

             <div class="member">
                 <div class="member-photo">
                     <img src="artemm.jpg" alt="Артём">
                 </div>
                 <h3>темка</h3>
                 <p>сынок.</p>
            </div>
            <div class="member">
                 <div class="member-photo">
                     <img src="babushka.jpg" alt="Бабушка">
                 </div>
                <h3>Бабушка</h3>
                <p>мудрая, но ворчливая.</p>
                 </div>
        </div>

    </div>

</body>
<link rel="stylesheet" href="style.css">
</html>
